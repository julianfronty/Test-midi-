<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test enregistreur MIDI</title>
<style>
body{margin:0;padding:24px 16px;background:#f6f4ef;color:#1d1b18;font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
.card{background:#fff;border:1px solid #e2dccf;border-radius:12px;padding:16px;display:grid;gap:12px}
button{font:inherit;border-radius:999px;padding:10px 18px;border:1px solid #9a6b1f;background:#9a6b1f;color:#fff}
button:disabled{opacity:.45}
.last{font-size:2rem;font-weight:600;min-height:2.4rem}
.ok{color:#2e7d4f}.bad{color:#b03a2e}
textarea{width:100%;min-height:140px;box-sizing:border-box;font:13px monospace}
</style>
</head>
<body>
<main>
<h1>Test enregistreur MIDI</h1>
<div class="card">
<button id="connect">Connecter le piano</button>
<p id="conn">Pas encore connecté.</p>
<div class="last" id="last">–</div>
</div>
<div class="card">
<div><button id="rec" disabled>Enregistrer</button> <button id="stop" disabled>Arrêter</button></div>
<p id="count">0 note enregistrée.</p>
<textarea id="out" readonly></textarea>
<button id="copy" disabled>Copier</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const N=['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
let t0=0,rec=false,ev=[],pend=new Map();
function msg(e){const[s,n,v]=e.data,c=s&0xf0,now=performance.now();
if(c===0x90&&v>0){$('last').textContent=N[n%12]+(Math.floor(n/12)-1);if(rec)pend.set(n,{n,v,s:now-t0});}
else if(c===0x80||(c===0x90&&v===0)){const p=pend.get(n);if(p&&rec){ev.push({note:n,velocity:p.v,start:Math.round(p.s),end:Math.round(now-t0)});pend.delete(n);}}}
function attach(a){const l=[...a.inputs.values()];l.forEach(i=>i.onmidimessage=msg);
if(!l.length){$('conn').textContent='Aucun appareil MIDI trouvé. Rebranche le piano.';$('conn').className='bad';return;}
$('conn').textContent='Piano connecté : '+l.map(i=>i.name).join(', ');$('conn').className='ok';$('rec').disabled=false;}
$('connect').onclick=async()=>{if(!navigator.requestMIDIAccess){$('conn').textContent='Ce navigateur ne lit pas le MIDI.';$('conn').className='bad';return;}
try{const a=await navigator.requestMIDIAccess();attach(a);a.onstatechange=()=>attach(a);}
catch(err){$('conn').textContent='Accès au MIDI refusé ('+err.name+').';$('conn').className='bad';}};
$('rec').onclick=()=>{rec=true;ev=[];pend=new Map();t0=performance.now();$('rec').disabled=true;$('stop').disabled=false;$('count').textContent='Enregistrement…';};
$('stop').onclick=()=>{rec=false;$('stop').disabled=true;$('rec').disabled=false;$('count').textContent=ev.length+' note(s) enregistrée(s).';$('out').value=JSON.stringify({notes:ev});$('copy').disabled=!ev.length;};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);$('copy').textContent='Copié';}catch{$('out').select();}};
</script>
</body>
</html>
